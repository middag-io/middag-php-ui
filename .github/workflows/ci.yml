name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Test namespaces follow PSR-4 (autoload + autoload-dev)
        run: composer dump-autoload --strict-psr

      - name: Run tests
        run: composer test

  quality:
    name: Static analysis & style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Lint (PHP 8.2 parse floor)
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          php -l .php-cs-fixer.dist.php > /dev/null
          php -l .php-rector.php > /dev/null

      - name: PHPStan
        run: composer check:stan

      - name: Coding standards
        run: composer check:style

      - name: Rector
        run: composer check:rector

      - name: Schema drift (generated schemas in sync with value objects)
        run: composer check:schemas
