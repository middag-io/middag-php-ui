name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Released php-library-check component of middag-io/actions, pinned by
  # commit SHA with the tag in a comment. One job per PHP version: the static
  # checks (composer validate --strict, strict PSR-4, the PHP 8.2 parse lint,
  # PHPStan, PHP-CS-Fixer, Rector and the schema drift gate) run on 8.2, the
  # audit and PHPUnit on every version. No credentials.
  php-library-check:
    uses: middag-io/actions/.github/workflows/php-library-check.yml@5e6dc3d595edc2bf6134043a2b17067af5f64c25 # php-library-check-v1.0.0
    permissions:
      contents: read
    with:
      php-versions: '["8.2", "8.3", "8.4"]'
      composer-validate-strict: true
      lint-script: check:lint
      composer-scripts: check:schemas
      audit-blocking-severities: critical, high
