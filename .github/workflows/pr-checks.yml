name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  # Two pull request checks in one job, as steps of released composites of
  # middag-io/actions called by their major tag.
  # Both read the pull request title or its
  # history, run on the same trigger and need only contents: read.
  #
  # The job name keeps the status context that the main ruleset requires.
  pr-checks:
    name: php-version-family-check / check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The head commit with the full history: fetch-depth 0 also fetches
      # every branch (as refs/remotes/origin/*) and every tag, so both checks
      # read the base commit, the base branch and the release tag.
      - name: Check out the pull request with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The family window is the repository variable PHP_LIBS_OPEN_RELEASE,
      # set per repository and never on the organization (empty = closed,
      # X.0 = MAJOR window).
      - name: Version family check
        uses: middag-io/actions/php-version-family-check@php-version-family-check-v1
        with:
          window: ${{ vars.PHP_LIBS_OPEN_RELEASE }}
          family-from: 2.0.0-rc.1
          title: ${{ github.event.pull_request.title }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          window-branch: ${{ github.event.repository.default_branch }}

      # release-please walks main newest committer date first and stops at the
      # commit of the last release, so a commit dated before that release is
      # never read. This step fails such a pull request and prints how to
      # recreate the branch with cherry-pick (never rebase or force-push).
      - name: Release date check
        if: ${{ !cancelled() }}
        uses: middag-io/actions/github-release-date-check@github-release-date-check-v1
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
