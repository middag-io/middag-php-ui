name: Release

# Opens or updates the release pull request from the Conventional Commits on
# main and, when that pull request merges, creates the tag and the GitHub
# release.
#
# release-please runs through the release-please component of
# middag-io/actions, called by its major tag, with the
# token of the release GitHub App (client id in an organization variable,
# private key in an organization secret). A release pull request opened or
# updated with the App token triggers the pull request workflows of this
# repository, including the required version family check.
#
# The release is gated on a green CI run of a push to main. The
# workflow_run trigger fires only after CI finishes; the job guard requires
# success. workflow_dispatch bypasses the gate deliberately (retry). Never
# publish a tag while CI is red. No paths filter: the merge of the release
# pull request must always run release-please. workflow_run runs nothing from
# the triggering run: the component checks out only the configuration and the
# manifest of the default branch, and the job also requires a push event.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    uses: middag-io/actions/.github/workflows/release-please.yml@release-please-v1
    # The component only checks out the configuration and the manifest; every
    # write (release branch, pull request, tag, release) uses the App token.
    permissions:
      contents: read
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      app-client-id: ${{ vars.GH_APPS_MIDDAG_CI_RELEASE_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.GH_APPS_MIDDAG_CI_RELEASE_PRIVATE_KEY }}

  # @middag-io/ui-contracts (middag-io/middag-react, packages/contracts) mirrors
  # schema/ from a release tag. On a release, send it the tag: its Contracts
  # mirror workflow copies the schemas, regenerates the TypeScript and opens a
  # pull request when they changed. Nothing here builds or reads React code.
  #
  # A prerelease tag (for example v2.0.0-rc.1) must not notify: the mirror
  # regenerates only on a stable tag. A SemVer prerelease always carries a
  # hyphen, a stable tag never does.
  #
  # This repository is public, so the job mints the release App token itself
  # instead of calling the private dispatch component. repository_dispatch
  # needs contents: write on the target; the App holds it on middag-react.
  notify-contracts:
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' && !contains(needs.release-please.outputs.tag-name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_APPS_MIDDAG_CI_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APPS_MIDDAG_CI_RELEASE_PRIVATE_KEY }}
          owner: middag-io
          repositories: middag-react
          permission-contents: write

      - name: Send php-ui-released to middag-react
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          gh api --method POST repos/middag-io/middag-react/dispatches \
            -f event_type=php-ui-released \
            -f "client_payload[tag]=${TAG}"
          echo "Sent php-ui-released (${TAG}) to middag-io/middag-react."
