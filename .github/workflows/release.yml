name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Manifest mode: the per-package release-type lives in
          # release-please-config.json. Passing release-type inline here forces
          # non-manifest mode and silently ignores the config file — which dropped
          # bump-minor-pre-major and changelog-sections, bumping a pre-1.0
          # breaking change to 1.0.0 instead of 0.5.0.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
